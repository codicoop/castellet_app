<div class="lg:grid lg:grid-cols-12">
	<h2 class="text-2xl font-semibold mb-4
		lg:text-4xl lg:col-span-4">
		{{ value.title }}
	</h2>
	<div class="text-base [&>p]:mb-4
		[&>img]:rounded-lg lg:[&>img]:rounded-2xl [&>img]:my-12 [&>img]:mx-auto
		[&>img]:shadow-md [&>img]:w-full
		[&>img.full-width]:w-3/4 
		[&>img.left]:w-1/2 [&>img.left]:ml-0 [&>img.right]:w-1/2 [&>img.right]:mr-0
		[&>ol>li]:list-[decimal-leading-zero] [&>ol>li]:ml-12 [&>ol>li]:pl-1 [&>ol]:mb-4
		[&>ul>li]:list-disc [&>ul>li]:ml-8 [&>ul>li]:pl-1 [&>ul]:mb-4
		[&>h2]:text-xl [&>h2]:font-bold [&>h2]:mb-2 lg:[&>h2]:text-3xl
		[&>h3]:text-lg [&>h3]:font-semibold [&>h3]:mb-2 lg:[&>h3]:text-2xl
		[&>h4]:text-base [&>h4]:font-bold [&>h4]:mb-2 lg:[&>h4]:text-xl
		lg:col-start-6 lg:col-span-7">
		{{ value.body }}
	</div>
</div>
