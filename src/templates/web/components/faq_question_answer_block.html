{% load static i18n wagtailcore_tags %}

<details class="relative w-full rounded-2xl shadow-card px-4 py-6 lg:p-6 lg:pr-28">
	<summary class="leading-5 text-xl text-primary-500 font-bold cursor-pointer">
		<h2 class="inline leading-5 font-title text-lg font-semibold pr-7 text-gray-900">{{ value.question }}</h2>
	</summary>
	<div class="text-base pt-4 [&>p]:mb-4 
		[&>a]:underline [&>a]:text-primary-500">
		{{ value.answer|richtext }}
	</div>
</details>
